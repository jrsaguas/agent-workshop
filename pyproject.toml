[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workshop"
version = "0.1.0"
description = "Configurable and composable specialized agent studio"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-workshop = "agent_workshop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
